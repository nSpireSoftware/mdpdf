<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Convert Markdown to PDF with Mermaid diagrams and LaTeX math">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MD to PDF">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Markdown to PDF</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  
  <!-- Core libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- Mermaid for diagrams -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
  
  <!-- KaTeX for math -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #e2e8f0;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      text-align: center;
      padding: 30px 0;
    }
    
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
    }
    
    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    
    .feature-badge {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #a5b4fc;
    }
    
    .install-banner {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    
    .install-banner.show { display: flex; }
    
    .install-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    .install-btn:hover { background: #4f46e5; transform: scale(1.02); }
    
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.8rem; }
      .features { gap: 10px; }
    }
    
    .panel {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .panel-header {
      background: rgba(51, 65, 85, 0.5);
      padding: 12px 20px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .panel-header svg { width: 20px; height: 20px; }
    
    textarea {
      flex: 1;
      min-height: 400px;
      background: transparent;
      border: none;
      padding: 20px;
      color: #e2e8f0;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    
    textarea::placeholder { color: #64748b; }
    
    .preview {
      flex: 1;
      min-height: 400px;
      padding: 20px;
      overflow-y: auto;
      background: white;
      color: #1e293b;
    }
    
    .preview h1, .preview h2, .preview h3, .preview h4 {
      color: #0f172a;
      margin: 1em 0 0.5em;
      line-height: 1.3;
    }
    
    .preview h1 { font-size: 2em; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.3em; }
    .preview h2 { font-size: 1.5em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; }
    .preview h3 { font-size: 1.25em; }
    
    .preview p { margin: 1em 0; line-height: 1.7; }
    .preview ul, .preview ol { margin: 1em 0; padding-left: 2em; }
    .preview li { margin: 0.5em 0; }
    
    .preview code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 0.9em;
    }
    
    .preview pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
    }
    
    .preview pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }
    
    .preview blockquote {
      border-left: 4px solid #6366f1;
      margin: 1em 0;
      padding: 0.5em 1em;
      background: #f8fafc;
      color: #475569;
    }
    
    .preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
    }
    
    .preview th, .preview td {
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      text-align: left;
    }
    
    .preview th { background: #f1f5f9; font-weight: 600; }
    .preview a { color: #6366f1; }
    .preview hr { border: none; border-top: 2px solid #e2e8f0; margin: 2em 0; }
    
    /* Mermaid diagram styling */
    .preview .mermaid {
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      margin: 1em 0;
      text-align: center;
    }
    
    .preview .mermaid svg {
      max-width: 100%;
      height: auto;
    }
    
    /* KaTeX math styling */
    .preview .katex-display {
      margin: 1em 0;
      overflow-x: auto;
      overflow-y: hidden;
    }
    
    .preview .katex {
      font-size: 1.1em;
    }
    
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.8);
    }
    
    .btn svg { width: 20px; height: 20px; }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      text-align: center;
      padding: 40px;
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(99, 102, 241, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    
    .drop-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .drop-message {
      text-align: center;
      color: white;
    }
    
    .drop-message svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    
    .drop-message p {
      font-size: 1.5rem;
      font-weight: 600;
    }
    
    .update-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
      z-index: 1001;
      font-weight: 500;
    }
    
    .update-banner button {
      background: white;
      color: #059669;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    
    .update-banner button.dismiss {
      background: rgba(255,255,255,0.2);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📄 Markdown to PDF</h1>
      <p class="subtitle">Paste or drag & drop your markdown, then download as PDF</p>
      <div class="features">
        <span class="feature-badge">📊 Mermaid Diagrams</span>
        <span class="feature-badge">📐 LaTeX Math</span>
        <span class="feature-badge">📱 Works Offline</span>
      </div>
    </header>
    
    <div class="install-banner" id="installBanner">
      <span>📲 Install this app for quick offline access!</span>
      <button class="install-btn" id="installBtn">Install App</button>
    </div>
    
    <div class="main-grid">
      <div class="panel">
        <div class="panel-header">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Markdown Input
        </div>
        <textarea id="markdown" placeholder="# Paste your markdown here...

## Mermaid Diagrams

```mermaid
graph TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do something]
    B -->|No| D[Do something else]
    C --> E[End]
    D --> E
```

## LaTeX Math

Inline math: $E = mc^2$

Block math:
$$
\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}
$$

## Regular Markdown

- **Bold** and *italic* text
- Lists, tables, code blocks
- All standard markdown features
"></textarea>
      </div>
      
      <div class="panel">
        <div class="panel-header">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Live Preview
        </div>
        <div class="preview" id="preview">
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>Your preview will appear here</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-secondary" id="clearBtn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        Clear
      </button>
      <button class="btn btn-secondary" id="copyHtmlBtn" disabled>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        Copy HTML
      </button>
      <button class="btn btn-primary" id="downloadBtn" disabled>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span id="btnText">Download PDF</span>
      </button>
    </div>
  </div>
  
  <div class="toast" id="toast">PDF downloaded successfully!</div>
  
  <div class="drop-overlay" id="dropOverlay">
    <div class="drop-message">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <p>Drop your Markdown file here</p>
    </div>
  </div>

  <script>
    // Initialize Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      fontFamily: 'system-ui, sans-serif'
    });
    
    const markdownInput = document.getElementById('markdown');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyHtmlBtn = document.getElementById('copyHtmlBtn');
    const clearBtn = document.getElementById('clearBtn');
    const btnText = document.getElementById('btnText');
    const toast = document.getElementById('toast');
    const installBanner = document.getElementById('installBanner');
    const installBtn = document.getElementById('installBtn');
    const dropOverlay = document.getElementById('dropOverlay');
    
    let deferredPrompt;
    let dragCounter = 0;
    let mermaidId = 0;
    
    // Drag and drop handling
    document.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (e.dataTransfer.types.includes('Files')) {
        dropOverlay.classList.add('active');
      }
    });
    
    document.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        dropOverlay.classList.remove('active');
      }
    });
    
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
    });
    
    document.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');
      
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.name.endsWith('.txt') || file.type === 'text/plain' || file.type === 'text/markdown')) {
        const text = await file.text();
        markdownInput.value = text;
        updatePreview();
        showToast(`Opened: ${file.name}`);
      } else if (file) {
        showToast('Please drop a Markdown (.md) file');
      }
    });
    
    // PWA Install handling
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.add('show');
    });
    
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBanner.classList.remove('show');
      }
      deferredPrompt = null;
    });
    
    window.addEventListener('appinstalled', () => {
      installBanner.classList.remove('show');
      showToast('App installed successfully!');
    });
    
    // Service Worker Registration with update prompt
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service Worker registered', reg.scope);
          
          reg.onupdatefound = () => {
            const newWorker = reg.installing;
            newWorker.onstatechange = () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdatePrompt();
              }
            };
          };
        })
        .catch((err) => console.log('Service Worker registration failed', err));
    }
    
    function showUpdatePrompt() {
      const banner = document.createElement('div');
      banner.className = 'update-banner';
      banner.innerHTML = `
        <span>🎉 A new version is available!</span>
        <button onclick="window.location.reload()">Update now</button>
        <button class="dismiss" onclick="this.parentElement.remove()">Later</button>
      `;
      document.body.appendChild(banner);
    }
    
    // Custom renderer for marked to handle mermaid code blocks
    const renderer = new marked.Renderer();
    const originalCodeRenderer = renderer.code.bind(renderer);
    
    renderer.code = function(code, language) {
      if (language === 'mermaid') {
        mermaidId++;
        return `<div class="mermaid" id="mermaid-${mermaidId}">${code}</div>`;
      }
      return originalCodeRenderer(code, language);
    };
    
    // Configure marked
    marked.setOptions({
      renderer: renderer,
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false
    });
    
    // Render mermaid diagrams
    async function renderMermaid() {
      const mermaidDivs = preview.querySelectorAll('.mermaid');
      for (const div of mermaidDivs) {
        const id = div.id;
        const code = div.textContent;
        try {
          const { svg } = await mermaid.render(id + '-svg', code);
          div.innerHTML = svg;
        } catch (err) {
          div.innerHTML = `<pre style="color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 4px;">Mermaid Error: ${err.message}</pre>`;
        }
      }
    }
    
    // Render LaTeX math
    function renderMath() {
      renderMathInElement(preview, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        errorColor: '#ef4444'
      });
    }
    
    // Update preview
    async function updatePreview() {
      const md = markdownInput.value.trim();
      
      if (!md) {
        preview.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>Your preview will appear here</p>
          </div>
        `;
        downloadBtn.disabled = true;
        copyHtmlBtn.disabled = true;
        return;
      }
      
      // Reset mermaid ID counter for consistent rendering
      mermaidId = 0;
      
      // Parse markdown
      preview.innerHTML = marked.parse(md);
      
      // Render mermaid diagrams
      await renderMermaid();
      
      // Render math
      renderMath();
      
      downloadBtn.disabled = false;
      copyHtmlBtn.disabled = false;
    }
    
    // Debounce function
    function debounce(fn, delay) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }
    
    markdownInput.addEventListener('input', debounce(updatePreview, 300));
    
    // Clear button
    clearBtn.addEventListener('click', () => {
      markdownInput.value = '';
      updatePreview();
    });
    
    // Copy HTML button
    copyHtmlBtn.addEventListener('click', async () => {
      if (!markdownInput.value.trim()) return;
      
      try {
        const html = preview.innerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const plainBlob = new Blob([html], { type: 'text/plain' });
        
        await navigator.clipboard.write([
          new ClipboardItem({
            'text/html': blob,
            'text/plain': plainBlob
          })
        ]);
        showToast('HTML copied to clipboard!');
      } catch (err) {
        // Fallback: copy as plain text
        try {
          await navigator.clipboard.writeText(preview.innerHTML);
          showToast('Copied as plain text (rich text not supported)');
        } catch (e) {
          showToast('Failed to copy');
        }
      }
    });
    
    // Show toast
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Download PDF
    downloadBtn.addEventListener('click', async () => {
      if (!markdownInput.value.trim()) return;
      
      const originalText = btnText.textContent;
      btnText.innerHTML = '<div class="spinner"></div>';
      downloadBtn.disabled = true;
      
      // Clone and prepare for PDF
      const element = preview.cloneNode(true);
      element.style.padding = '40px';
      element.style.maxWidth = '800px';
      element.style.margin = '0 auto';
      element.style.background = 'white';
      
      const opt = {
        margin: [15, 15, 15, 15],
        filename: 'document.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2,
          useCORS: true,
          letterRendering: true,
          logging: false
        },
        jsPDF: { 
          unit: 'mm', 
          format: 'a4', 
          orientation: 'portrait' 
        },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };
      
      try {
        await html2pdf().set(opt).from(element).save();
        showToast('PDF downloaded successfully!');
      } catch (err) {
        showToast('Error generating PDF');
        console.error(err);
      } finally {
        btnText.textContent = originalText;
        downloadBtn.disabled = false;
      }
    });
    
    // Handle files opened with the PWA (File Handling API)
    if ('launchQueue' in window) {
      launchQueue.setConsumer(async (launchParams) => {
        if (launchParams.files && launchParams.files.length > 0) {
          const file = await launchParams.files[0].getFile();
          const text = await file.text();
          markdownInput.value = text;
          updatePreview();
          showToast(`Opened: ${file.name}`);
        }
      });
    }
    
    // Initialize
    updatePreview();
  </script>
</body>
</html>
